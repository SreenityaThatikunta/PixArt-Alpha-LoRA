name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only ML stack
        run: |
          python -m pip install --upgrade pip
          # CPU wheels keep the job well under the runner's disk and time budget.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install diffusers transformers peft accelerate sentencepiece pillow clean-fid pytest

      - name: Run tests
        run: pytest
